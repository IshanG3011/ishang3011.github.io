<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>
<body>
    <form action="forms.php" method="post">
        <label for="username">Username:</label>
         <input type="text"  id="username" minlength="4" placeholder="IshanGupta3011" required><br><br>
         <label for="password">Password:</label>
         <input type="password" id="password" minlength="9" placeholder="Enter your password" required><br><br>
         <label for="age">Age:</label>
         <input type="number" id="age" min="18" max="100" placeholder="Enter your age" required><br><br>
         <label for="email">Email:</label>
         <input type="email" id="email" placeholder="abc@gmail.com"><br><br>
         <label for="bday">Birthday:</label>
         <input type="date" id="bday"><br><br>
         <label for="color">Color:</label>
            <input type="color" id="color"><br><br>
            <label for="checkbox">Subscribe to newsletter:</label>
            <input type="checkbox" id="checkbox"><br><br>
            <label for="description">Description:</label>
            <textarea id="description" placeholder="Tell us about yourself..." maxlength="200"></textarea><br><br>
            <label for="comment">Comment:</label>
            <textarea id="comment" placeholder="Enter your comment..." maxlength="200"></textarea><br><br>
            <label for="gender">Gender:</label>
            <select id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select><br><br>
            <label for="radio">Title:</label>
            <label for="mr.">Mr.</label>
            <input type="radio" value="mr" name="title">
            <label for="mrs.">Mrs.</label>
            <input type="radio" value="mrs" name="title">
            <label for="Phd.">Phd.</label>
            <input type="radio" value="ms" name="title"><br><br>
         <input type="reset">
         <input type="submit">

    </form>

</body>
</html>
